[env]
COLORTERM = "truecolor"

[tools]
# --- Languages ---
lua = "latest"
node = "latest"
python = "3.13"
ruby = "latest"
uv = "latest"

# --- Core Utilities ---
bat = "latest"
cmake = "latest"
delta = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gitleaks = "latest"
herdr = "latest"
neovim = "latest"
ripgrep = "latest"
sd = "latest"
tmux = "latest"
usage = "latest"
zoxide = "latest"

# --- Language Servers ---
lua-language-server = "latest"
rust-analyzer = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"

# --- Linters / Formatters ---
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
tree-sitter = "latest"
yamlfmt = "latest"

# --- Utilities via Cargo & NPM ---
"cargo:git-absorb" = "latest"
"cargo:https://github.com/rtk-ai/rtk" = "HEAD"
"cargo:ouch" = "latest"
"npm:hunkdiff" = "latest"

[tasks."py:sync"]
description = "Sync base Python packages"
run = 'uv pip install --python "$(mise which python3)" --upgrade -r ~/dotfiles/requirements.txt'
