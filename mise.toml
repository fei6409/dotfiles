[env]
COLORTERM = "truecolor"

[tools]
# --- Languages ---
lua = "latest"
node = "latest"
python = "3.13"
ruby = "latest"
uv = "latest"

# --- Core Utilities ---
bat = "latest"
cmake = "latest"
delta = "latest"
duf = "latest"
dust = "latest"
eza = "latest"
fd = "latest"
fzf = "latest"
gitleaks = "latest"
herdr = "latest"
neovim = "latest"
ripgrep = "latest"
sd = "latest"
tmux = "latest"
zoxide = "latest"

# --- Language Servers ---
lua-language-server = "latest"
rust-analyzer = "latest"
"npm:bash-language-server" = "latest"
"npm:yaml-language-server" = "latest"

# --- Linters / Formatters ---
ruff = "latest"
shellcheck = "latest"
shfmt = "latest"
stylua = "latest"
tombi = "latest"
tree-sitter = "latest"
yamlfmt = "latest"

# --- Utilities via Cargo & NPM ---
"cargo:git-absorb" = "latest"
"cargo:https://github.com/rtk-ai/rtk" = "HEAD"
"cargo:ouch" = "latest"
"npm:hunkdiff" = "latest"

[hooks]
postinstall = [
  """if [[ "$MISE_TOOL_NAME" == "python" ]]; then
       uv pip install --python "$MISE_TOOL_INSTALL_PATH/bin/python3" --upgrade \
         ipython numpy scipy requests PyYAML
     fi"""
]
