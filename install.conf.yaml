---
- defaults:
    link:
      create: true
      relink: true
    create:
      mode: 0755

- clean: ['~']

#### common links
- link:
    # git
    ~/.gitconfig:
    ~/.gitignore.global:
    # oh-my-tmux
    ~/.tmux: modules/tmux
    ~/.tmux.conf: modules/tmux/.tmux.conf
    ~/.tmux.conf.local:
    # vim
    ~/.vimrc:
    # nvim / lua
    ~/.config/nvim/lua:
    ~/.config/nvim/init.lua:
    # zsh / prezto
    ~/.zshrc:
    ~/.zpreztorc:
    ~/.zprofile:
    ~/.zprezto: modules/prezto
    ~/.zlogin: modules/prezto/runcoms/zlogin
    ~/.zlogout: modules/prezto/runcoms/zlogout
    ~/.zshenv: modules/prezto/runcoms/zshenv
    ~/.zprezto/contrib/fast-syntax-highlighting: modules/fast-syntax-highlighting
    # others
    ~/.config/ghostty/config: ghostty-config
    ~/.config/herdr/config.toml: herdr.toml
    ~/.config/hunk/config.toml: hunk.toml
    ~/.config/mise/config.toml: mise.toml
    ~/.utils.zsh:
    ~/.alias.zsh:
    ~/.clang-tidy:
    ~/.shellcheckrc:
    ~/.jjconfig.toml:
    ~/.local/bin/better-git-branch: bin/better-git-branch
    ~/.local/bin/herdr-navi-path: bin/herdr-navi-path
    ~/.local/bin/tmux-navi-path: bin/tmux-navi-path
    ~/.local/bin/unarchive: bin/unarchive
    ~/.local/bin/zoxide-select-path: bin/zoxide-select-path
    # ~/.p10k.zsh:
    # ~/.my-git-prompt.zsh:

#### Linux links
- defaults:
    link:
      if: '[[ `uname` == Linux ]]'
- link:
    # binaries
    ~/.local/bin/ssh-forward: bin/ssh-forward
    # fcitx5 autostart
    ~/.config/autostart/org.fcitx.Fcitx5.desktop:
      path: /usr/share/applications/org.fcitx.Fcitx5.desktop
