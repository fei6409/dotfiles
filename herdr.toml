onboarding = false

[keys]
prefix = "ctrl+a"

# Generic
detach = ["prefix+q", "prefix+d", "prefix+ctrl+d"]
new_tab = ["prefix+c", "prefix+ctrl+c"]

# Pane switching
focus_pane_left = ["prefix+h", "alt+h"]
focus_pane_down = ["prefix+j", "alt+j"]
focus_pane_up = ["prefix+k", "alt+k"]
focus_pane_right = ["prefix+l", "alt+l"]
last_pane = "prefix+a"

# Split
split_vertical = ["prefix+|"]
split_horizontal = ["prefix+minus"]

[[keys.command]]
key = "prefix+o"
type = "popup"
command = "herdr-navi-path"
description = "Navigate path within a new tab"
width = "80%"
height = "80%"

[ui]
pane_gaps = false
prompt_new_tab_name = false
show_agent_labels_on_pane_borders = true
tab_bar_position = "bottom"

[ui.sound]
enabled = false

[ui.toast]
delivery = "herdr"

[theme]
name = "vesper"
auto_switch = false
